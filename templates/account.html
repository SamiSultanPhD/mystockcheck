{% extends "base.html" %}

{% block title %}Account{% endblock %}

{% block styles %}
<link rel="stylesheet" type="text/css"
      href="{{ url_for('static',
             filename='styles/auth.css') }}">
{% endblock %}

{% block content %}
<div class="auth__page">
    <h1>Account</h1>
    <p>
        Logged in as <strong>{{ current_user.username }}</strong>
        ({{ current_user.role }})
    </p>

    <h2>Change Email</h2>
    <form method="POST" class="auth__form">
        <input type="hidden"
               name="action"
               value="change_email">
        <label for="new_email">New email</label>
        <input type="email"
               id="new_email"
               name="new_email"
               value="{{ current_user.email }}"
               required>
        <label for="email_password">
            Current password (to confirm)
        </label>
        <input type="password"
               id="email_password"
               name="password"
               required>
        <button type="submit">Update Email</button>
    </form>

    <h2>Change Password</h2>
    <form method="POST" class="auth__form">
        <input type="hidden"
               name="action"
               value="change_password">
        <label for="current_password">
            Current password
        </label>
        <input type="password"
               id="current_password"
               name="current_password"
               required>
        <label for="new_password">
            New password
        </label>
        <input type="password"
               id="new_password"
               name="new_password"
               required>
        <label for="confirm_password">
            Confirm new password
        </label>
        <input type="password"
               id="confirm_password"
               name="confirm_password"
               required>
        <button type="submit">
            Update Password
        </button>
    </form>
</div>
{% endblock %}
