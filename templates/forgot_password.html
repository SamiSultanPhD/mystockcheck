{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block styles %}
<link rel="stylesheet" type="text/css"
      href="{{ url_for('static',
             filename='styles/auth.css') }}">
{% endblock %}

{% block content %}
<div class="auth__page">
    <h1>Forgot Password</h1>
    <p>
        Enter your username and email address.
        Your reset request will be reviewed
        and actioned manually.
    </p>
    <form method="POST" class="auth__form">
        <label for="username">Username</label>
        <input type="text"
               id="username"
               name="username"
               required>

        <label for="email">Email</label>
        <input type="email"
               id="email"
               name="email"
               required>

        <button type="submit">
            Request Password Reset
        </button>
    </form>
    <p>
        <a href="{{ url_for('login') }}">
            Back to login
        </a>
    </p>
</div>
{% endblock %}
